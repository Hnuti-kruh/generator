services:
  kruh-generator:
    image: ${GENERATOR_IMAGE:?Set GENERATOR_IMAGE to a tested GHCR sha tag or digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      proxy:
        aliases: [kruh-generator]
    ports:
      - "127.0.0.1:18082:8080"
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
